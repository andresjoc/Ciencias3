<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Ciencias de la Computación 3 - Ejercicios{% endblock %}</title>

    <!-- Enlace al archivo CSS externo mediante Flask -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="main-card">

      <!-- Barra de navegación: permite cambiar entre los ejercicios -->
      <nav class="nav-bar">
        <a
          href="{{ url_for('index') }}"
          class="nav-btn {{ 'active' if active_page == 'pila' else '' }}"
        >📚 TDA Pila</a>
        <a
          href="{{ url_for('colas') }}"
          class="nav-btn {{ 'active' if active_page == 'colas' else '' }}"
        >🧮 Colas: Planificación de Tareas</a>
      </nav>

      {% block content %}{% endblock %}
    </div>
  </body>
</html>
